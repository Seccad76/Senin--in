<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Giriş ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #ff1744,
                #ff4081,
                #e040fb,
                #ff6f91,
                #ff1744
            );

            background-size: 400% 400%;

            animation:
                arkaPlanHareket 10s ease infinite;

            overflow: hidden;
        }

        @keyframes arkaPlanHareket {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .girisKutusu {
            width: 360px;
            max-width: 90vw;

            padding: 38px;

            background:
                rgba(255, 255, 255, 0.93);

            border-radius: 30px;

            text-align: center;

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.25);

            position: relative;

            z-index: 20;
        }

        h1 {
            color: #d81b60;
            margin-bottom: 25px;
        }

        input {
            width: 100%;

            padding: 15px;

            margin: 9px 0;

            border:
                2px solid #eeeeee;

            border-radius: 20px;

            font-size: 16px;

            outline: none;

            transition: 0.3s;
        }

        input:focus {
            border-color: #ff4081;

            box-shadow:
                0 0 10px rgba(255, 64, 129, 0.3);
        }

        #girisButon {
            width: 100%;

            margin-top: 15px;

            padding: 15px;

            border: none;
            border-radius: 25px;

            background: linear-gradient(
                90deg,
                #ff1744,
                #ff4081
            );

            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        #girisButon:hover {
            transform: scale(1.04);
        }

        #hata {
            color: #c62828;
            margin-top: 12px;
            font-size: 14px;
        }

        /* İPUCU BUTONU */

        #ipucuButon {
            margin-top: 10px;

            border: none;
            background: transparent;

            color: #d81b60;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        #ipucuButon:hover {
            text-decoration: underline;
        }

        /* İPUCU KUTUSU */

        #ipucuKutusu {
            display: none;

            margin-top: 15px;
            padding: 15px;

            border-radius: 18px;

            background:
                rgba(255, 64, 129, 0.10);

            color: #7a1645;

            font-size: 14px;
            line-height: 1.5;

            text-align: left;
        }

        .ipucuBaslik {
            font-weight: bold;
            color: #d81b60;
        }

        /* UÇUŞAN KALPLER */

        .kalp {
            position: fixed;

            bottom: -70px;

            pointer-events: none;

            z-index: 2;

            animation:
                yukari 6s linear forwards;
        }

        /* UÇUŞAN YAZILAR */

        .sevgiYazisi {
            position: fixed;

            bottom: -70px;

            color: white;

            font-size: 22px;
            font-weight: bold;

            white-space: nowrap;

            pointer-events: none;

            z-index: 3;

            text-shadow:
                0 3px 8px rgba(0,0,0,0.35);

            animation:
                yukari 8s linear forwards;
        }

        @keyframes yukari {
            from {
                transform: translateY(0);
                opacity: 1;
            }

            to {
                transform: translateY(-115vh);
                opacity: 0;
            }
        }

        @media (max-width: 500px) {
            .girisKutusu {
                padding: 30px;
            }

            h1 {
                font-size: 26px;
            }
        }

    </style>
</head>


<body>


    <div class="girisKutusu">

        <h1>
            ❤️ Hoş Geldin ❤️
        </h1>

        <input
            type="text"
            id="kullanici"
            placeholder="Kullanıcı adı"
            autocomplete="off">

        <input
            type="password"
            id="sifre"
            placeholder="Şifre">

        <button
            id="girisButon"
            onclick="girisYap()">

            Giriş Yap ❤️

        </button>

        <p id="hata"></p>


        <!-- İPUCU BUTONU -->

        <button
            id="ipucuButon"
            onclick="ipucuAcKapat()">

            💡 İpucu

        </button>


        <!-- İPUCU KUTUSU -->

        <div id="ipucuKutusu">

            <div class="ipucuBaslik">
                Kullanıcı adı:
            </div>

            Hikâyemizin başka bir hâl aldığı,
            yazın sonlarına yaklaşan o ay… 

            <br><br>

            <div class="ipucuBaslik">
                Şifre:
            </div>

            O güzel başlangıcın yaşandığı yıl… 

        </div>

    </div>



    <script>

        /* GİRİŞ */

        function girisYap() {

            const kullanici =
                document
                    .getElementById("kullanici")
                    .value
                    .trim()
                    .toLocaleLowerCase("tr-TR");


            const sifre =
                document
                    .getElementById("sifre")
                    .value
                    .trim();


            if (
                kullanici === "ağustos" &&
                sifre === "2025"
            ) {

                window.location.href =
                    "ayicik.html";

            }

            else {

                document
                    .getElementById("hata")
                    .innerText =
                    "Kullanıcı adı veya şifre yanlış ❤️";

            }

        }


        /* İPUCU AÇ / KAPAT */

        function ipucuAcKapat() {

            const kutu =
                document.getElementById("ipucuKutusu");

            const buton =
                document.getElementById("ipucuButon");


            if (
                kutu.style.display === "block"
            ) {

                kutu.style.display =
                    "none";

                buton.innerText =
                    "💡 İpucu";

            }

            else {

                kutu.style.display =
                    "block";

                buton.innerText =
                    "💡 İpucunu Kapat";

            }

        }


        /* KALP OLUŞTUR */

        function kalpOlustur() {

            const kalp =
                document.createElement("div");


            kalp.className =
                "kalp";


            const kalpler = [

                "❤️",
                "💖",
                "💕",
                "💗",
                "💘",
                "💞"

            ];


            kalp.innerHTML =
                kalpler[
                    Math.floor(
                        Math.random() *
                        kalpler.length
                    )
                ];


            kalp.style.left =
                Math.random() * 100 + "vw";


            kalp.style.fontSize =
                (22 + Math.random() * 38)
                + "px";


            kalp.style.animationDuration =
                (4 + Math.random() * 3)
                + "s";


            document.body.appendChild(kalp);


            setTimeout(function() {

                kalp.remove();

            }, 7000);

        }


        /* SEVGİ YAZISI */

        function yaziOlustur() {

            const yazi =
                document.createElement("div");


            yazi.className =
                "sevgiYazisi";


            const yazilar = [

                "عزیزم ❤️",

                "دوستت دارم ❤️",

                "Seni Seviyorum ❤️",

                "İyi ki Varsın 💕",

                "İyi ki Biz ❤️",

                "Sadece Sen 💖",

                "Hep Sen ❤️"

            ];


            yazi.innerHTML =
                yazilar[
                    Math.floor(
                        Math.random() *
                        yazilar.length
                    )
                ];


            yazi.style.left =
                (5 + Math.random() * 70)
                + "vw";


            document.body.appendChild(yazi);


            setTimeout(function() {

                yazi.remove();

            }, 9000);

        }


        /* SAYFA AÇILINCA KALPLER */

        for (let i = 0; i < 25; i++) {

            setTimeout(
                kalpOlustur,
                i * 120
            );

        }


        /* KALPLER SÜREKLİ */

        setInterval(
            kalpOlustur,
            450
        );


        /* YAZILAR SÜREKLİ */

        setInterval(
            yaziOlustur,
            2200
        );


        /* ENTER İLE GİRİŞ */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    girisYap();

                }

            }
        );

    </script>


</body>

</html>
