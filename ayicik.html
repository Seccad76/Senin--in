<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sürpriz ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            text-align: center;

            background: linear-gradient(
                135deg,
                #ff1744,
                #ff4081,
                #e040fb,
                #ff6f91
            );

            background-size: 400% 400%;

            animation: arkaPlan 10s ease infinite;

            overflow: hidden;
        }


        /* HAREKETLİ ARKA PLAN */

        @keyframes arkaPlan {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }


        /* =========================
           İLK EKRAN
           ========================= */

        #ilkEkran {
            display: flex;
            flex-direction: column;
            align-items: center;

            position: relative;
            z-index: 20;
        }


        #baslik {
            color: white;
            font-size: 34px;

            text-shadow:
                0 3px 10px rgba(0,0,0,0.35);
        }


        #ayicik1 {
            width: 290px;
            max-width: 80vw;

            border-radius: 25px;

            cursor: pointer;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.30);

            transition: 0.3s;
        }


        #ayicik1:hover {
            transform: scale(1.05);
        }


        /* =========================
           SÜRPRİZ EKRANI
           ========================= */

        #surprizEkran {
            display: none;

            flex-direction: column;
            justify-content: center;
            align-items: center;

            position: relative;
            z-index: 20;
        }


        /* =========================
           KALP FOTOĞRAFI
           ========================= */

        #kalpFotograf {
            width: 430px;
            height: auto;

            max-width: 88vw;
            max-height: 56vh;

            object-fit: contain;

            display: block;

            filter:
                drop-shadow(
                    0 12px 25px rgba(0,0,0,0.35)
                );

            animation:
                fotografKalpAtisi 1.5s infinite;
        }


        /* FOTOĞRAF HAFİF KALP ATIŞI YAPSIN */

        @keyframes fotografKalpAtisi {

            0% {
                transform: scale(1);
            }

            12% {
                transform: scale(1.025);
            }

            24% {
                transform: scale(1);
            }

            36% {
                transform: scale(1.015);
            }

            48% {
                transform: scale(1);
            }

            100% {
                transform: scale(1);
            }
        }


        /* =========================
           İKİNCİ AYICIK
           ========================= */

        #ayicik2 {
            width: 165px;

            margin-top: -20px;

            border-radius: 20px;

            border: 4px solid white;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.35);

            position: relative;
            z-index: 30;
        }


        /* =========================
           SENİ SEVİYORUM
           ========================= */

        #mesaj {
            margin-top: 10px;

            color: white;

            font-size: 31px;
            font-weight: bold;

            text-shadow:
                0 3px 10px rgba(0,0,0,0.45);
        }


        /* =========================
           SAYFAYA GİT
           ========================= */

        #buton {
            margin-top: 12px;

            padding: 15px 42px;

            border: none;
            border-radius: 30px;

            background: white;
            color: #d81b60;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.25);

            transition: 0.3s;
        }


        #buton:hover {
            transform: scale(1.06);
        }


        /* =========================
           UÇUŞAN KALPLER
           ========================= */

        .kalp {
            position: fixed;

            bottom: -70px;

            pointer-events: none;

            z-index: 50;

            animation:
                yukari 6s linear forwards;
        }


        /* =========================
           UÇUŞAN YAZILAR
           ========================= */

        .sevgiYazisi {
            position: fixed;

            bottom: -70px;

            color: white;

            font-size: 22px;
            font-weight: bold;

            white-space: nowrap;

            pointer-events: none;

            z-index: 45;

            text-shadow:
                0 3px 8px rgba(0,0,0,0.5);

            animation:
                yukari 8s linear forwards;
        }


        @keyframes yukari {

            from {
                transform: translateY(0);
                opacity: 1;
            }

            to {
                transform: translateY(-115vh);
                opacity: 0;
            }
        }


        /* =========================
           TELEFON
           ========================= */

        @media (max-width: 600px) {

            #baslik {
                font-size: 27px;
            }

            #ayicik1 {
                width: 250px;
            }

            #kalpFotograf {
                width: 340px;
                max-height: 48vh;
            }

            #ayicik2 {
                width: 125px;
                margin-top: -10px;
            }

            #mesaj {
                font-size: 25px;
            }

            #buton {
                font-size: 16px;
                padding: 13px 32px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         İLK EKRAN
         ========================= -->

    <div id="ilkEkran">

        <h1 id="baslik">
            Ayıcığa Dokun 🧸❤️
        </h1>


        <img
            id="ayicik1"
            src="ayicik1.jpg"
            onclick="surpriz()"
            alt="Ayıcık">

    </div>



    <!-- =========================
         AYICIĞA DOKUNUNCA
         ========================= -->

    <div id="surprizEkran">


        <!-- KALP ŞEKLİNDEKİ FOTOĞRAFIN -->

        <img
            id="kalpFotograf"
            src="arkaplan.png"
            alt="Kalp Fotoğraf">


        <!-- KALPLİ AYICIK -->

        <img
            id="ayicik2"
            src="ayicik2.jpg"
            alt="Seni Seviyorum">


        <!-- MESAJ -->

        <div id="mesaj">

            ❤️ Seni Seviyorum ❤️

        </div>


        <!-- PDF SAYFASINA GEÇ -->

        <button
            id="buton"
            onclick="window.location.href='pdfler.html'">

            Sayfaya Git ❤️

        </button>


    </div>



    <!-- =========================
         MÜZİK
         ========================= -->

    <audio
        id="muzik"
        loop>

        <source
            src="muzik.mp3"
            type="audio/mpeg">

    </audio>



    <script>


        let surprizAcildi = false;


        /* =========================
           AYICIĞA DOKUNUNCA
           ========================= */

        function surpriz() {


            if (surprizAcildi) {
                return;
            }


            surprizAcildi = true;


            /* İLK EKRANI KAPAT */

            document
                .getElementById("ilkEkran")
                .style.display = "none";


            /* SÜRPRİZ EKRANINI AÇ */

            document
                .getElementById("surprizEkran")
                .style.display = "flex";


            /* MÜZİĞİ BAŞLAT */

            document
                .getElementById("muzik")
                .play()
                .catch(function() {

                    console.log(
                        "Müzik başlatılamadı."
                    );

                });


            /* İLK ANDA BOL KALP */

            for (let i = 0; i < 40; i++) {

                setTimeout(
                    kalpOlustur,
                    i * 90
                );
            }


            /* İLK FARSI YAZI */

            setTimeout(function() {

                yaziOlustur(
                    "عزیزم ❤️"
                );

            }, 400);


            /* İKİNCİ FARSI YAZI */

            setTimeout(function() {

                yaziOlustur(
                    "دوستت دارم ❤️"
                );

            }, 1200);

        }



        /* =========================
           KALP OLUŞTUR
           ========================= */

        function kalpOlustur() {


            const kalp =
                document.createElement("div");


            kalp.className =
                "kalp";


            const kalpler = [

                "❤️",
                "💖",
                "💕",
                "💗",
                "💘",
                "💞"

            ];


            kalp.innerHTML =

                kalpler[
                    Math.floor(
                        Math.random()
                        *
                        kalpler.length
                    )
                ];


            /* RASTGELE YER */

            kalp.style.left =
                Math.random()
                *
                100
                +
                "vw";


            /* RASTGELE BOYUT */

            kalp.style.fontSize =

                (
                    22
                    +
                    Math.random()
                    *
                    38
                )
                +
                "px";


            /* RASTGELE HIZ */

            kalp.style.animationDuration =

                (
                    4
                    +
                    Math.random()
                    *
                    3
                )
                +
                "s";


            document
                .body
                .appendChild(kalp);


            setTimeout(function() {

                kalp.remove();

            }, 7000);

        }



        /* =========================
           SEVGİ YAZISI
           ========================= */

        function yaziOlustur(
            ozelYazi = null
        ) {


            const yazi =
                document.createElement("div");


            yazi.className =
                "sevgiYazisi";


            const yazilar = [

                "عزیزم ❤️",

                "دوستت دارم ❤️",

                "Seni Seviyorum ❤️",

                "İyi ki Varsın 💕",

                "İyi ki Biz ❤️",

                "Sadece Sen 💖",

                "Hep Sen ❤️"

            ];


            if (ozelYazi !== null) {

                yazi.innerHTML =
                    ozelYazi;

            }

            else {

                yazi.innerHTML =

                    yazilar[
                        Math.floor(
                            Math.random()
                            *
                            yazilar.length
                        )
                    ];

            }


            /* YAZILAR ORTADAKİ
               FOTOĞRAFI KAPATMASIN */

            if (
                Math.random() < 0.5
            ) {

                yazi.style.left =

                    (
                        2
                        +
                        Math.random()
                        *
                        15
                    )
                    +
                    "vw";

            }

            else {

                yazi.style.right =

                    (
                        2
                        +
                        Math.random()
                        *
                        15
                    )
                    +
                    "vw";

            }


            document
                .body
                .appendChild(yazi);


            setTimeout(function() {

                yazi.remove();

            }, 9000);

        }



        /* =========================
           KALPLER SÜREKLİ UÇSUN
           ========================= */

        setInterval(
            kalpOlustur,
            500
        );



        /* =========================
           YAZILAR SÜREKLİ UÇSUN
           ========================= */

        setInterval(
            yaziOlustur,
            2500
        );


    </script>


</body>

</html>
